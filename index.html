<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Targo — Scaling the platform for your business</title>
    <meta
      name="description"
      content="Targo builds the testing infrastructure modern teams rely on — from automated pipelines to full-scale QA audits."
    />

    <!-- Quantico (400 + 700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Section 1 — Hero -->
    <section class="hero" id="home">
      <!-- Background video (decorative, never captures clicks) -->
      <video
        class="hero__video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
      >
        <source
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260823_050407_500d0339-ab28-41c1-9688-132a74a3b5aa.mp4"
          type="video/mp4"
        />
      </video>

      <!-- Desktop scrim: fades the video out behind the headline -->
      <div class="hero__scrim" aria-hidden="true"></div>
    </section>

    <!-- Section 2 — About -->
    <section class="about" id="about"><!-- about content --></section>

    <script src="js/main.js" defer></script>
  </body>
</html>
