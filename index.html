<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Targo — Scaling the platform for your business</title>
    <meta
      name="description"
      content="Targo builds the testing infrastructure modern teams rely on — from automated pipelines to full-scale QA audits."
    />

    <!-- Quantico (400 + 700) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quantico:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Section 1 — Hero -->
    <section class="hero" id="home">
      <!-- Background video (decorative, never captures clicks) -->
      <video
        class="hero__video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        aria-hidden="true"
      >
        <source
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260823_050407_500d0339-ab28-41c1-9688-132a74a3b5aa.mp4"
          type="video/mp4"
        />
      </video>

      <!-- Desktop scrim: fades the video out behind the headline -->
      <div class="hero__scrim" aria-hidden="true"></div>

      <!-- Navbar -->
      <header class="nav">
        <a class="nav__brand" href="#home" aria-label="Targo home">
          <span class="nav__logo" aria-hidden="true">
            <svg width="38" height="38" viewBox="0 0 38 38">
              <circle cx="19" cy="19" r="19" fill="#111" />
              <ellipse
                cx="19"
                cy="19"
                rx="10"
                ry="4"
                fill="#fff"
                transform="rotate(-25 19 19)"
              />
            </svg>
          </span>
          <span class="nav__brandname">targo</span>
        </a>

        <nav class="nav__links" aria-label="Primary">
          <a href="#home">Home</a>
          <a href="#about">About</a>
          <a href="#contact">Contact us</a>
        </nav>

        <a class="nav__contact" href="#contact">
          <svg
            class="nav__mail"
            width="17"
            height="13"
            viewBox="0 0 17 13"
            fill="none"
            aria-hidden="true"
          >
            <rect
              x="0.7"
              y="0.7"
              width="15.6"
              height="11.6"
              rx="1"
              stroke="currentColor"
              stroke-width="1.4"
            />
            <path
              d="M1 1.8 L8.5 7 L16 1.8"
              stroke="currentColor"
              stroke-width="1.4"
            />
          </svg>
          Contact us
        </a>

        <button
          class="nav__burger"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <span></span><span></span><span></span>
        </button>
      </header>

      <!-- Mobile stacked menu (toggled by the hamburger) -->
      <nav class="nav__menu" id="mobile-menu" aria-label="Mobile">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact us</a>
      </nav>
    </section>

    <!-- Section 2 — About -->
    <section class="about" id="about"><!-- about content --></section>

    <script src="js/main.js" defer></script>
  </body>
</html>
